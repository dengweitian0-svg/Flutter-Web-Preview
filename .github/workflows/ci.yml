name: Windows extension checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: flutter-web-preview-vsix
          path: artifacts/*.vsix
          if-no-files-found: error

  integration:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      FLUTTER_SDK_PATH: ${{ github.workspace }}\.cache\flutter-sdk
      PUB_CACHE: ${{ github.workspace }}\.cache\pub
      PREVIEW_TEST_MODE: e2e
      PREVIEW_STRESS_CYCLES: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Checkout Flutter 3.49.0-1.0.pre-240
        uses: actions/checkout@v7
        with:
          repository: flutter/flutter
          ref: 4e5a09292c1c64a38d604c7ec096537f50d69f93
          path: .cache/flutter-sdk
          persist-credentials: false
      - name: Bootstrap Flutter SDK
        run: '& "$env:FLUTTER_SDK_PATH\bin\flutter.bat" --suppress-analytics --version'
      - name: Prepare fixture
        working-directory: test/fixtures/flutter_app
        run: '& "$env:FLUTTER_SDK_PATH\bin\flutter.bat" --suppress-analytics pub get'
      - run: npm run test:extension
      - name: Verify application Debug Console logs
        run: npm run test:extension
        env:
          PREVIEW_TEST_MODE: logs
          PREVIEW_STRESS_CYCLES: '0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-flutter-3.49.0-pre-240
          path: artifacts/

